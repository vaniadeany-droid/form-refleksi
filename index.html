<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Refleksi Karyawan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Form Refleksi Karyawan</h1>
  <p class="intro">Jawab setiap pertanyaan dengan merekam suara (maksimal 5 menit) atau mengetik. Rekaman akan disimpan dan ditranskripsi oleh tim HR. Dengan mengirim form ini, Anda menyetujui hal tersebut. Gunakan tempat yang tenang dan izinkan akses mikrofon saat diminta.</p>
  <div id="form"></div>
  <button id="submit" type="button">Kirim jawaban</button>
  <p id="status" role="status"></p>
</main>
<script src="script.js"></script>
</body>
</html>
